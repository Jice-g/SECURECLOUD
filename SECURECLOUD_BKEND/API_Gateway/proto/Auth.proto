syntax = "proto3";

package auth;

service AuthService {
    rpc ValidateToken (TokenRequest) returns (TokenResponse);

    rpc Login (LoginRequest) returns (LoginResponse);
}

message TokenRequest {
    string token = 1;
}

message TokenResponse {
    bool is_valid = 1;
}

message LoginRequest {
    string login = 1;
    string password = 2;
    string mfa_code = 3;
}

message UserProfile {
    string id = 1;
    string login = 2;
    string role = 3; 
    string created_at = 4;
}

message LoginResponse {
    string access_token = 1;
    string refresh_token = 2;
    string token_type = 3;
    int32 expires_in = 4; 
    UserProfile user = 5;
}